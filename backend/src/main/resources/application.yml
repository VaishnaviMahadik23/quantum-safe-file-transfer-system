spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: quantum-safe-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/quantum_safe_transfer
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000